name: chatwoot

x-app: &app
  # Unmodified upstream Community Edition, stable v4.18.0, native ARM64.
  image: chatwoot/chatwoot:v4.18.0-ce@sha256:faaa58a911cda8f2ab9d717ddf8ca4332163b07da4c5da10711d896e5d667442
  env_file: /etc/chatwoot/chatwoot.env
  volumes:
    - storage:/app/storage
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  cpu_shares: 256
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mail-relay:
    build: ./mail-relay
    image: mesa/chatwoot-mail-relay:pilot
    env_file: /etc/chatwoot/mail-relay.env
    restart: unless-stopped
    cpus: 0.2
    cpu_shares: 128
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks:
      default:
      edge:
        aliases: [chatwoot-mail-relay]
    depends_on:
      rails:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  rails:
    <<: *app
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, "3000", -b, "0.0.0.0"]
    cpus: 1.0
    mem_limit: 3g
    networks:
      default:
      edge:
        aliases: [chatwoot-web]
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, "r = Net::HTTP.get_response(URI('http://127.0.0.1:3000/api'), {'X-Forwarded-Proto' => 'https'}); exit(r.code == '200' ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sidekiq:
    <<: *app
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    cpus: 0.5
    mem_limit: 2g

  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use --env-file /etc/chatwoot/chatwoot.env}
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB]
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    cpus: 0.4
    cpu_shares: 256
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: [CMD, pg_isready, -U, chatwoot, -d, chatwoot_production]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    env_file: /etc/chatwoot/chatwoot.env
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes:
      - redis:/data
    restart: unless-stopped
    cpus: 0.1
    cpu_shares: 256
    mem_limit: 512m
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true
    name: plane_default

volumes:
  storage:
  postgres:
  redis:
